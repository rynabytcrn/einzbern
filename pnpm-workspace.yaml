packages:
  - packages/*

overrides:
  fast-uri: "3.1.8"

# pnpm 11 reads non-registry settings from YAML, not .npmrc.
# Online acquisition must opt in explicitly; verification never fetches dependencies.
offline: true
preferOffline: true
frozenLockfile: true
ignoreScripts: true
saveExact: true
strictPeerDependencies: true
