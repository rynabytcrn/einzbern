name: Generated distribution verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: helper
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - name: Read immutable generator reference
        id: source
        working-directory: helper
        run: |
          # JavaScript template expressions must reach Node without shell expansion.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const source = JSON.parse(readFileSync(".github/engine-source.json", "utf8"));
            assert.equal(source.repository, "tpmoonchefryan/einzbern");
            assert.match(source.commit, /^[0-9a-f]{40}$/u);
            appendFileSync(process.env.GITHUB_OUTPUT, `commit=${source.commit}\n`);
          '
      - name: Checkout the pinned engine generator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tpmoonchefryan/einzbern
          ref: ${{ steps.source.outputs.commit }}
          path: engine
          persist-credentials: false
      - name: Acquire exact generator dependencies
        working-directory: engine
        env:
          npm_config_offline: "false"
          npm_config_prefer_offline: "false"
          npm_config_ignore_scripts: "true"
        run: |
          npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund --no-update-notifier --prefer-online
          test "$(pnpm --version)" = "11.3.0"
          pnpm install --frozen-lockfile --ignore-scripts --config.offline=false
      - name: Verify version, generated bytes, syntax and archive offline
        working-directory: engine
        env:
          COREPACK_ENABLE_NETWORK: "0"
          npm_config_offline: "true"
        run: |
          export HOME="$RUNNER_TEMP/helper-home" EINZBERN_HOME="$RUNNER_TEMP/helper-device"
          mkdir -p "$HOME" "$EINZBERN_HOME"
          pnpm run --silent build
          node scripts/verify-helper-generated.mjs --helper "$GITHUB_WORKSPACE/helper"
